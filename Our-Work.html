<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="description" content="Incenso Studio — Our work. Hair, nails, make-up, brows and lashes — straight from the chair." />
<meta name="theme-color" content="#e5dcc9" />
<title>Our Work — Incenso Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="assets/site.css" />
<style>
.bleed{margin-inline:calc(-1 * var(--gutter))}
.w-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:end;padding:clamp(28px,5vw,72px) 0 clamp(28px,4vw,48px)}
.w-hero h1{font-size:clamp(44px,7.4vw,108px);line-height:0.96;letter-spacing:-0.035em}
.w-hero p{margin:0;font-size:clamp(15px,1.3vw,18px);line-height:1.55;color:rgba(0,0,0,0.78);max-width:44ch;justify-self:end;text-wrap:pretty}
.w-cover{position:relative;aspect-ratio:21/9;background:rgba(254,254,241,0.55);border-bottom:1px solid var(--card-line);overflow:hidden}
.w-cover image-slot{position:absolute;inset:0;width:100%;height:100%}
.ph image-slot{position:absolute;inset:0;width:100%;height:100%}
.wall-wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:clamp(24px,4vw,64px);padding:clamp(28px,4vw,56px) 0 clamp(48px,7vw,96px)}
.filters{position:sticky;top:calc(clamp(24px,3.2vw,40px) + 100px);display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.filters .k{font-family:var(--font-mono);font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:rgba(0,0,0,0.4);margin:0 0 6px}
.filter{appearance:none;background:transparent;border:0;padding:2px 0;cursor:pointer;font-family:var(--font-mono);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(0,0,0,0.5);position:relative;transition:color 160ms;text-align:left}
.filter .n{font-size:9px;vertical-align:super;margin-left:4px;opacity:0.7}
.filter::before{content:"";position:absolute;left:-14px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:999px;background:var(--fg-warm);opacity:0;transition:opacity 160ms}
.filter:hover,.filter[aria-pressed="true"]{color:var(--fg-warm)}
.filter[aria-pressed="true"]::before{opacity:1}
.wall{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:minmax(120px,auto);grid-auto-flow:dense;gap:clamp(14px,2vw,28px)}
.work{display:block;color:inherit;text-decoration:none;grid-column:span 2}
.work.tall{grid-column:span 2;grid-row:span 2}
.work.wide{grid-column:span 4}
.work .ph{position:relative;border:1px solid var(--card-line);background:rgba(254,254,241,0.55);overflow:hidden;aspect-ratio:1}
.work.tall .ph{aspect-ratio:3/4.4}
.work.wide .ph{aspect-ratio:2.2}
.work .ph::after{content:"";position:absolute;inset:0;background:var(--acc);opacity:0.16;pointer-events:none;transition:opacity 240ms}
.work:hover .ph::after{opacity:0.32}
.work .c{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;margin-top:10px}
.work .ix{font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;color:rgba(0,0,0,0.4)}
.work .nm{font-size:15px;font-weight:600;letter-spacing:-0.01em;margin:0}
.work .nm small{display:block;font-weight:400;font-size:12.5px;color:rgba(0,0,0,0.58);margin-top:2px}
.work .by{font-family:var(--font-mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(0,0,0,0.5);white-space:nowrap}
.work[hidden]{display:none}
@media (max-width:1024px){.wall{grid-template-columns:repeat(4,minmax(0,1fr))}.work.wide{grid-column:span 4}}
@media (max-width:880px){.w-hero{grid-template-columns:1fr}.w-hero p{justify-self:start}.wall-wrap{grid-template-columns:1fr;gap:20px}.filters{position:static;flex-direction:row;flex-wrap:wrap;gap:10px 22px}.filters .k{display:none}.filter::before{display:none}}
@media (max-width:560px){.wall{grid-template-columns:repeat(2,minmax(0,1fr))}.work,.work.tall,.work.wide{grid-column:span 2;grid-row:auto}.work.tall .ph{aspect-ratio:3/4}}
</style>
<template id="__bundler_thumbnail" data-bg-color="#e5dcc9"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#e5dcc9"/><text x="200" y="262" text-anchor="middle" font-family="Georgia,serif" font-size="180" fill="#000">i</text></svg></template>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<main class="page" id="main" data-screen-label="Our Work">
<header class="w-hero">
<div><h1>Real chairs,<br>real light.</h1></div>
<p>No filters, no ring lights — what left the studio, photographed where it happened. Every piece books the same service with the same hands.</p>
</header>
<div class="w-cover bleed"><image-slot id="work-cover" shape="rect" placeholder="Our work — header image"></image-slot></div>
<div class="wall-wrap">
<aside class="filters" id="filters" aria-label="Filter by service"></aside>
<section class="wall" id="wall" aria-label="Recent work"></section>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase.js"></script>
<script src="assets/site.js"></script>
<script src="assets/catalog.js"></script>
<script src="assets/image-slot.js"></script>
<script src="assets/phone.js"></script>
<script src="assets/auth.js"></script>
<script>
(() => {
const C = window.IncensoCatalog;
const WORK = [
{ svc: 'Highlights', staff: 'Peru', note: 'Lived-in blonde, toned warm for olive skin. Two and a half hours, zero foils showing.' },
{ svc: 'Gel X', staff: 'Aya', note: 'Short almond, sheer milk with a chrome edge.' },
{ svc: 'Engagement Makeup', staff: 'Mia', note: 'Soft brown eye, glass skin, built to last past midnight.' },
{ svc: 'Haircut', staff: 'Peru', note: 'Collarbone bob, blunt with an inward finish.' },
{ svc: 'Brow Lamination', staff: 'Jana', note: 'Set upward, tinted a shade under the hair.' },
{ svc: 'Classic Pedicure', staff: 'Hala', note: 'Classic red, squared with soft corners.' },
{ svc: 'Full Updo', staff: 'Peru', note: 'Low twisted chignon, pinned to survive dancing.' },
{ svc: 'Lash Lift & Tint', staff: 'Jana', note: 'Natural lashes, lifted and tinted black.' },
{ svc: 'Full-Head Color', staff: 'Peru', note: 'Espresso brunette with a mahogany finish.' },
{ svc: 'Acrylic Full Set', staff: 'Aya', note: 'Long coffin, hand-painted micro French.' },
{ svc: 'Natural Makeup', staff: 'Mia', note: 'Shoot-ready skin, brushed brow, nude lip.' },
{ svc: 'Keratin Smoothing Treatment', staff: 'Peru', note: 'Three months of quiet mornings.' },
];
const catOf = (n) => (C.SERVICES.find((s) => s.name === n) || {}).cat || '';
const accOf = (n) => (C.STAFF.find((s) => s.name === n) || {}).accent || '#F9A8D4';
const pad = (n) => String(n).padStart(2, '0');
const link = (w) => 'Book.html?svc=' + encodeURIComponent(w.svc) + (C.STAFF.some((s) => s.name === w.staff) ? '&staff=' + encodeURIComponent(w.staff) : '');
const SHAPE = ['tall', '', 'wide', '', 'tall', '', '', 'wide', '', 'tall', ''];
const wall = document.getElementById('wall'), fl = document.getElementById('filters');
wall.innerHTML = WORK.map((w, i) => '<a class="work ' + SHAPE[i % SHAPE.length] + '" data-cat="' + catOf(w.svc) + '" style="--acc:' + accOf(w.staff) + '" href="' + link(w) + '"><div class="ph"><image-slot id="work-' + (i + 1) + '" shape="rect" placeholder="' + w.svc + '"></image-slot></div><div class="c"><span class="ix">' + pad(i + 1) + '</span><p class="nm">' + w.svc + '<small>' + w.note + '</small></p><span class="by">' + w.staff + '</span></div></a>').join('');
const cats = ['All'].concat(C.CATS.map((c) => c.name));
let filter = 'All';
const render = () => {
fl.innerHTML = '<p class="k">Filter</p>' + cats.map((c) => '<button type="button" class="filter" data-cat="' + c + '" aria-pressed="' + (c === filter) + '">' + c + '<span class="n">' + (c === 'All' ? WORK.length : WORK.filter((w) => catOf(w.svc) === c).length) + '</span></button>').join('');
wall.querySelectorAll('.work').forEach((w) => { w.hidden = filter !== 'All' && w.dataset.cat !== filter; });
};
fl.addEventListener('click', (e) => { const b = e.target.closest('.filter'); if (!b) return; filter = b.dataset.cat; render(); });
render();
})();
</script>
</body>
</html>
