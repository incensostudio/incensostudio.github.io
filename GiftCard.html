<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="description" content="Incenso Studio — your gift card." />
<meta name="theme-color" content="#e5dcc9" />
<title>Gift card — Incenso Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="assets/site.css" />
<style>
.ref-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin:0 0 16px}
.ref{font-family:var(--font-mono);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(0,0,0,0.6)}
.status{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;padding:5px 11px;border-radius:999px;border:1px solid currentColor;color:var(--sc,#1F9A56)}
.banner{display:none;align-items:center;gap:12px;margin:22px 0 0;padding:13px 18px;border:1px solid rgba(0,0,0,0.25);background:rgba(254,254,241,0.6);font-size:14px;font-weight:500}
.banner.show{display:inline-flex}
.banner .x{font-weight:400;color:rgba(0,0,0,0.6)}
.gc-timer{font-family:var(--font-mono);font-weight:600;color:#8C5A10;font-variant-numeric:tabular-nums}
.pay-note{margin:14px 0 0;padding:12px 14px;border:1px solid rgba(201,130,27,0.45);background:rgba(201,130,27,0.06);font-size:13.5px;line-height:1.55;color:rgba(0,0,0,0.8);text-wrap:pretty}
.pay-note.cx{border-color:rgba(179,38,30,0.35);background:rgba(179,38,30,0.05)}
.pay-note b.amt{font-family:var(--font-mono)}
.status::before{content:"";width:6px;height:6px;border-radius:999px;background:currentColor}
.wrap{display:flex;flex-direction:column;gap:28px;margin-bottom:clamp(48px,7vw,96px)}
.vcard{position:relative;aspect-ratio:1.586;display:flex;flex-direction:column;justify-content:space-between;background:var(--acc,#F9A8D4);background-image:radial-gradient(120% 90% at 100% 0%,rgba(254,254,241,0.55),rgba(254,254,241,0) 60%);color:var(--fg-warm);padding:20px;border-radius:20px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,0.12)}
.vcard::after{content:"";position:absolute;inset:8px;border:1px dashed rgba(0,0,0,0.3);border-radius:13px;pointer-events:none}
.vcard > *{position:relative}
.vcard .wm{display:inline-flex;align-items:center}
.vcard .wm .wordmark{height:17px;width:auto;display:block}
.vcard .wm .wordmark path{fill:var(--fg-warm)}
.vcard .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:0.24em;text-transform:uppercase;font-weight:500;opacity:0.7}
.vcard .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.22em;text-transform:uppercase;opacity:0.65}
.vcard .k.v{display:block;margin-top:5px}
.vcard .mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 0}
.vcard .amt{font-family:var(--font-mono);font-weight:600;font-size:clamp(38px,11vw,60px);letter-spacing:-0.04em;line-height:1}
.vcard .to{font-size:14px;margin:12px 0 0;line-height:1.5}
.vcard .to b{font-weight:600}
.vcard .to .fr{opacity:0.75}
.vcard .to .msg{opacity:0.75;font-style:italic;font-size:14px}
.vcard .code{font-family:var(--font-mono);font-size:13px;font-weight:600;letter-spacing:0.22em}
.vcard .cbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:22px}
.vcard .cbar.end{align-items:flex-end}
.vcard .qr{display:block;width:clamp(44px,12vw,58px);aspect-ratio:1;opacity:0.9}
.vcard .qr svg{display:block;width:100%;height:100%}
.side{min-width:0;display:flex;flex-direction:column}
.blk{border-top:1px solid var(--card-line);padding:20px 0}
.blk:first-child{border-top:0;padding-top:0}
.blk.b-acts{order:-1;border-top:0;padding-top:0;padding-bottom:8px}
.blk.b-bal{order:-2}
.blk.b-acts .acts{margin:14px 0 4px;flex-direction:column;gap:10px}
.blk.b-acts .acts .btn{width:100%}
.blk-h{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;color:rgba(0,0,0,0.82);margin:0 0 14px}
.big{display:flex;align-items:baseline;justify-content:space-between;gap:16px;font-weight:600;font-size:16px}
.big .v{font-family:var(--font-mono);font-size:clamp(28px,3vw,40px);letter-spacing:-0.03em}
.big small{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(0,0,0,0.5);font-weight:500;margin-top:4px}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:9px 0;font-size:14px;color:rgba(0,0,0,0.7);border-bottom:1px solid var(--grid-line)}
.kv:last-child{border-bottom:0}
.kv .v{font-weight:600;color:var(--fg-warm);text-align:right}
.kv .v a{color:inherit}
.kv .v.neg{color:#C81E2D}
.kv .v.pos{color:#1F9A56}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.acts .btn:disabled{opacity:0.75;cursor:default}
.none{font-size:14px;color:rgba(0,0,0,0.55);margin:0}
section.missing{display:none;max-width:560px;padding:clamp(24px,3vw,40px) 0 clamp(64px,9vw,128px)}
.missing p{margin:0 0 24px;font-size:clamp(15px,1.3vw,18px);line-height:1.55;color:rgba(0,0,0,0.78)}
.missing .m-acts{display:flex;flex-direction:column;gap:10px}
.missing .m-acts .btn{width:100%}
body.missing .wrap{display:none}
body.missing section.missing{display:block}
.banner.show{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px 18px;line-height:1.5}
.banner .x{font-size:13px;line-height:1.5}
@media (min-width:881px){
.wrap{display:grid;grid-template-columns:minmax(300px,480px) minmax(0,1fr);gap:clamp(28px,4.5vw,64px);align-items:start}
.vcard{padding:clamp(20px,2.4vw,30px);border-radius:24px;box-shadow:0 24px 56px rgba(0,0,0,0.14)}
.vcard::after{inset:9px;border-radius:16px}
.vcard .amt{font-size:clamp(40px,4.6vw,60px)}
.vcard .to{font-size:15px;margin-top:14px}
.vcard .qr{width:clamp(44px,4.6vw,58px)}
.side{max-width:560px}
.blk{padding:clamp(20px,2.6vw,30px) 0}
.blk.b-acts{order:0;border-top:1px solid var(--card-line);padding-top:clamp(20px,2.6vw,30px);padding-bottom:clamp(20px,2.6vw,30px)}
.blk.b-bal{order:0}
.blk.b-acts .acts{margin:8px 0 0;flex-direction:row;flex-wrap:wrap}
.blk.b-acts .acts .btn{width:auto}
.banner.show{display:inline-flex;flex-direction:row;align-items:center;gap:12px;padding:13px 18px;line-height:normal}
.banner .x{font-size:14px}
.missing .m-acts{flex-direction:row;flex-wrap:wrap}
.missing .m-acts .btn{width:auto}
}
</style>
<template id="__bundler_thumbnail" data-bg-color="#e5dcc9"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#e5dcc9"/><text x="200" y="262" text-anchor="middle" font-family="Georgia,serif" font-size="180" fill="#000">i</text></svg></template>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<main class="page" id="main" data-screen-label="Gift card">
<section class="intro">
<div class="ref-row"><span class="ref" id="ref"></span><span class="status" id="status"></span></div>
<h1 id="h1">Your gift card.</h1>
<div class="banner" id="banner"></div>
</section>
<div class="wrap">
<div class="vcard" id="vcard"></div>
<aside class="side">
<div class="blk b-bal"><div class="big"><span>Balance<small id="balSub"></small></span><span class="v" id="bal"></span></div><p class="pay-note" id="payNote" hidden></p></div>
<div class="blk"><p class="blk-h">Details</p><div id="kv"></div></div>
<div class="blk" id="histBlk"><p class="blk-h">Used on</p><div id="hist"></div></div>
<div class="blk b-acts"><div class="acts" id="acts"></div></div>
</aside>
</div>
<section class="missing" role="status">
<p id="missingMsg">We couldn't find that gift card.</p>
<div class="m-acts"><a class="btn" href="/Account">Your account</a><a class="btn ghost" href="/Vouchers">Buy a gift card</a></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase.js"></script>
<script src="assets/site.js"></script>
<script src="assets/gift.js"></script>
<script src="assets/qr.js"></script>
<script src="assets/phone.js"></script>
<script src="assets/auth.js"></script>
<script>
(() => {
const A = window.IncensoAuth, G = window.IncensoGift, $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const nice = (iso) => iso ? new Date(String(iso).slice(0, 10) + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const code = new URLSearchParams(location.search).get('code') || '';
const WM = '<svg class="wordmark" viewBox="8 76 1282 226" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path class="wordmark-o" d="M984 189.676C984 145.506 1007.35 106.459 1045.99 89.6959C1058.86 84.1134 1073.44 81 1089.42 81C1104.88 81 1119.21 83.8833 1132.45 89.1591C1145.74 94.4656 1158.61 102.425 1171.92 112.854C1186.18 122.44 1204.38 132.7 1226.24 143.083C1248.11 153.466 1268.29 164.923 1278.49 178.496C1288.48 191.808 1284.77 206.378 1268.26 221.484C1259.99 229.045 1249.57 236.637 1238.27 243.876C1226.97 251.13 1214.87 257.924 1203.23 264.09C1179.98 276.282 1159.68 284.564 1141.54 289.288C1123.51 293.858 1106.92 296.558 1090.42 296.542C1074.56 296.573 1060.21 293.69 1047.37 288.414C1008.84 272.556 984 235.18 984 189.676ZM1100.66 280.914C1116.94 281.129 1140.85 277.985 1167.52 265.9C1180.95 259.857 1196.3 250.195 1210.71 237.956C1225.11 225.717 1235.17 211.746 1233.01 197.068C1230.81 182.115 1213.73 170.014 1195.25 159.125C1176.76 148.098 1161.34 137.117 1149.18 127.194C1137.32 117.087 1126.04 109.557 1114.71 104.542C1103.42 99.5574 1091.8 96.8888 1080.3 96.8888C1065.42 96.8888 1047.6 101.383 1033.51 113.453C1019.42 125.523 1009.04 145.184 1009.04 175.52C1009.04 205.856 1019.94 232.88 1036.56 251.391C1053.19 269.902 1075.7 280.638 1100.66 280.899V280.914Z"></path><path d="M13.5156 285V89.7H39.0156V285H13.5156ZM192.182 285L82.682 117.6V285H56.582V90H90.782L198.782 255.6V90H224.582V285H192.182ZM340.877 288.6C282.977 288.6 238.877 250.2 238.877 187.5C238.877 124.8 282.977 86.4 340.877 86.4C392.777 86.4 433.577 117.6 438.077 164.7H411.377C407.177 131.1 376.877 109.2 340.577 109.2C299.177 109.2 264.977 138 264.977 187.2C264.977 236.7 299.477 265.5 340.877 265.5C377.477 265.5 407.777 243 411.977 204.9H438.077C434.177 256.8 393.677 288.6 340.877 288.6ZM454.434 285V90H605.334V112.8H479.634V175.2H596.334V198H479.634V262.2H604.134V285H454.434ZM756.44 285L646.94 117.6V285H620.84V90H655.04L763.04 255.6V90H788.84V285H756.44ZM890.378 288.6C845.078 288.6 804.278 268.8 804.878 222.3H831.278C831.578 254.7 857.678 266.7 889.778 266.7C913.178 266.7 939.578 256.8 939.578 232.5C939.578 207 912.878 201.9 883.178 197.4C847.778 192.3 809.378 186.3 809.378 141.9C809.378 108.3 838.478 86.4 879.578 86.4C932.678 86.4 959.078 116.4 959.078 147.9H932.078C931.778 123.3 911.678 108 879.578 108C854.078 108 835.178 121.8 835.178 142.2C835.178 168 861.578 169.8 890.978 174.6C926.078 180.3 965.678 186.9 965.378 231.9C965.078 267 930.878 288.6 890.378 288.6Z"></path></svg>';
const card = (el, v) => { el.style.setProperty('--acc', v.acc || '#F9A8D4'); el.innerHTML = '<div class="cbar"><span class="wm">' + WM + '</span><span class="tag">Gift card</span></div><div class="mid"><div class="amt">$' + v.amount + '</div><p class="to">For <b>' + esc(v.to || '') + '</b>' + (v.from ? ' <span class="fr">\u2014 from ' + esc(v.from) + '</span>' : '') + (v.msg ? '<br><span class="msg">\u201c' + esc(v.msg) + '\u201d</span>' : '') + '</p></div><div class="cbar end"><span><span class="code">' + v.code + '</span><span class="k v">Valid to ' + nice(v.expires) + '</span></span><span class="qr">' + window.IncensoQR('https://www.incensostudio.com//Account') + '</span></div>'; };
const render = () => {
const acc = A.signedIn() ? A.get() : null;
const v = G.byCode(code);
const mine = acc && v && (G.same(v.buyerPhone, acc.phone) || (G.confirmed(v) && G.same(v.toPhone, acc.phone)));
if (!v || !mine) { document.body.classList.add('missing'); $('ref').textContent = 'Gift card'; $('status').hidden = true; $('h1').textContent = acc ? 'Hmm, nothing here.' : 'Sign in to see it.'; $('missingMsg').textContent = acc ? 'That gift card isn\u2019t linked to your number.' : 'Gift cards live in your account \u2014 sign in with your phone to open it.'; return; }
document.body.classList.remove('missing');
const recipient = G.confirmed(v) && G.same(v.toPhone, acc.phone), sender = G.same(v.buyerPhone, acc.phone) && !recipient;
const today = new Date().toISOString().slice(0, 10);
const st = G.active(v) ? ['Active', '#1F9A56'] : v.status === 'Used' ? ['Used up', '#8B5CC4'] : /reserved/i.test(v.status) ? ['Awaiting payment', '#C9821B'] : v.expiredReason ? ['Cancelled \u2014 unpaid', '#B3261E'] : (v.expires && v.expires < today) ? ['Expired', '#C81E2D'] : [v.status, '#C9821B'];
$('ref').textContent = 'Gift card ' + v.code;
if (new URLSearchParams(location.search).get('new')) { const bn = $('banner'); const forMe = G.same(v.toPhone, acc.phone); bn.innerHTML = '<span>' + (G.confirmed(v) ? (forMe ? 'Added \u2726' : 'Sent \u2726') : 'Reserved \u2726') + '</span><span class="x">' + (G.confirmed(v) ? (forMe ? '$' + v.amount + ' is on your balance now.' : 'On its way to ' + esc(v.to) + ' by WhatsApp \u2014 you both get a message.') : 'Sent to ' + (forMe ? 'you' : esc(v.to)) + ' the moment your payment is confirmed \u2014 details below.') + '</span>'; bn.classList.add('show'); }
$('status').textContent = st[0]; $('status').style.setProperty('--sc', st[1]);
const cx = G.cancelled(v);
$('h1').textContent = sender ? (cx ? 'Cancelled \u2014 was for ' + v.to + '.' : G.confirmed(v) ? 'Sent to ' + v.to + '.' : 'Reserved for ' + v.to + '.') : recipient && v.from && !G.same(v.buyerPhone, acc.phone) ? 'From ' + v.from + ', with love.' : 'Your gift card.';
card($('vcard'), v);
$('bal').textContent = cx ? '$0' : '$' + v.balance;
const pn = $('payNote'); pn.hidden = true; pn.classList.remove('cx');
if (/reserved/i.test(v.status)) { const dl = G.deadlineOf(v), transfer = /whish|omt/i.test(v.pay || ''); $('balSub').textContent = 'of $' + v.amount + ' \u00b7 awaiting payment'; pn.hidden = false; pn.innerHTML = (transfer ? 'Send <b class="amt">$' + v.amount + '</b> via ' + esc(v.pay) + ' to <b>+961 71 930 290</b>, with <b>' + v.code + '</b> in the note.' : 'Pay <b class="amt">$' + v.amount + '</b> at the studio and quote <b>' + v.code + '</b>.') + ' We confirm on WhatsApp and the card is sent the moment it lands.<br>Pay by <b>' + new Date(dl).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) + '</b> \u2014 <b class="gc-timer" data-deadline="' + dl + '"></b> left. After that the card is cancelled and nothing is charged.'; }
else if (v.expiredReason) { $('balSub').textContent = 'of $' + v.amount + ' \u00b7 cancelled'; pn.hidden = false; pn.classList.add('cx'); pn.textContent = v.expiredReason + ' Nothing was charged \u2014 you can buy a new card any time.'; }
else $('balSub').textContent = 'of $' + v.amount + (G.active(v) ? ' \u00b7 ready to use' : G.confirmed(v) ? ' \u00b7 ' + st[0].toLowerCase() : '');
const tEl = document.querySelector('.gc-timer'); if (window._gcTimer) clearInterval(window._gcTimer); if (tEl) { const tick = () => { const ms = Number(tEl.dataset.deadline) - Date.now(); if (ms <= 0) { clearInterval(window._gcTimer); G.load(); render(); return; } const hh = Math.floor(ms / 3600000), mm = Math.floor((ms % 3600000) / 60000), ss = Math.floor((ms % 60000) / 1000); tEl.textContent = hh >= 24 ? Math.floor(hh / 24) + 'd ' + (hh % 24) + 'h' : hh > 0 ? hh + 'h ' + String(mm).padStart(2, '0') + 'm' : mm + 'm ' + String(ss).padStart(2, '0') + 's'; }; tick(); window._gcTimer = setInterval(tick, 1000); }
const kv = (k, val) => '<div class="kv"><span>' + k + '</span><span class="v">' + val + '</span></div>';
$('kv').innerHTML = kv('For', esc(v.to) + (v.toPhone ? '<br><small style="font-weight:400;color:rgba(0,0,0,0.55)">' + esc(v.toPhone) + '</small>' : '')) + kv('From', esc(v.from || v.buyerName || '') + (v.buyerPhone ? '<br><small style="font-weight:400;color:rgba(0,0,0,0.55)">' + esc(v.buyerPhone) + '</small>' : '')) + kv(G.confirmed(v) ? 'Sent' : 'Reserved', nice(v.created)) + (cx ? kv('Cancelled', nice(new Date(G.deadlineOf(v)).toISOString().slice(0, 10))) : kv('Valid to', nice(v.expires))) + kv(G.confirmed(v) ? 'Paid' : 'Payment', esc(v.pay || '') + (cx ? ' \u00b7 not received' : G.confirmed(v) ? '' : ' \u00b7 awaiting confirmation'));
const used = (v.redemptions || []);
$('histBlk').hidden = !used.length;
$('hist').innerHTML = used.map((r) => '<div class="kv"><span>' + (r.amount < 0 ? 'Restored \u00b7 ' : '') + (r.what ? esc(r.what) + ' \u00b7 ' : '') + '<a href="/Booking?ref=' + esc(r.ref) + '">' + esc(r.ref) + '</a><br><small style="color:rgba(0,0,0,0.5)">' + nice(r.date) + '</small></span><span class="v ' + (r.amount < 0 ? 'pos' : 'neg') + '">' + (r.amount < 0 ? '+' : '\u2212') + '$' + Math.abs(r.amount) + '</span></div>').join('');
$('acts').innerHTML = (recipient && G.active(v) ? '<a class="btn" href="/Book">Use it on a booking</a>' : '') + (sender && G.confirmed(v) ? '<button type="button" class="btn" id="resend">Resend</button>' : '') + '<a class="btn ghost" href="/Account">Back to your account</a>' + (sender ? '<a class="btn ghost" href="/Vouchers">Buy another</a>' : '');
};
document.getElementById('acts').addEventListener('click', (e) => { const b = e.target.closest('#resend'); if (!b) return; b.disabled = true; b.textContent = 'Sending\u2026'; setTimeout(() => { b.textContent = 'Sent by WhatsApp \u2726'; setTimeout(() => { b.disabled = false; b.textContent = 'Resend'; }, 2600); }, 700); });
if (A.signedIn()) render(); else { render(); A.open(render); }
})();
</script>
</body>
</html>
